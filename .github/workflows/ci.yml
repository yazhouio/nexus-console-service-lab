name: CI
on: [push, pull_request]
jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # Only lint commits introduced by this push/PR; history before commitlint was adopted is left as-is.
      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Lint pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: pnpm exec commitlint --from "${{ github.event.before }}" --to "${{ github.event.after }}" --verbose
      - name: Lint pushed commit on new branch
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: pnpm exec commitlint --last --verbose
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Enforce actual Node version before dependency installation
        run: node scripts/check-node-version.mjs
      - name: Verify Node gate positive and negative cases
        run: node --test scripts/test/node-version.test.mjs
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm check:packages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build:routing-validation
      - run: pnpm test:e2e:preview
      - run: pnpm test:externalization
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: |
            test-results/
            playwright-report/
            packages/*/coverage/
