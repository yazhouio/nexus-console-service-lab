name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Enforce actual Node version before dependency installation
        run: node scripts/check-node-version.mjs
      - name: Verify Node gate positive and negative cases
        run: node --test scripts/test/node-version.test.mjs
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build:routing-validation
      - run: pnpm test:e2e:preview
      - run: pnpm test:externalization
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: |
            test-results/
            playwright-report/
