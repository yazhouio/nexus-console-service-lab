packages:
  - apps/*
  - packages/*

# Dependency compatibility baseline; the accepted runtime range lives in package.json.
nodeVersion: 24.14.1
engineStrict: true

catalog:
  '@playwright/test': 1.62.1
  '@rsbuild/core': 2.2.2
  '@rsbuild/plugin-react': 2.1.0
  '@rspack/cli': 2.2.2
  '@rspack/core': 2.2.2
  '@rspack/dev-server': 2.2.1
  '@rspack/plugin-react-refresh': 2.0.2
  '@rspress/core': 2.0.21
  '@types/node': 22.20.1
  '@vitest/coverage-v8': 4.1.11
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  react: 19.2.8
  react-dom: 19.2.8
  react-router: 8.3.1
  react-refresh: 0.18.0
  typescript: 7.0.2
  vitest: 4.1.11
  wujie: 2.1.0

# Native binary download for the git hook runner.
allowBuilds:
  lefthook: true
